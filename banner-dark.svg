<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="nginx — делаю Axiom, страницы «ссылка в био»">
  <title>nginx — делаю Axiom</title>
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="rgba(255,255,255,.10)"/></pattern>
    <radialGradient id="glow" cx="78%" cy="18%" r="62%"><stop offset="0" stop-color="#6f7684" stop-opacity=".55"/><stop offset="1" stop-color="#6f7684" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0a0a" stop-opacity="1"/><stop offset=".55" stop-color="#0a0a0a" stop-opacity=".0"/></linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .caret{animation:blink 1.15s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.caret{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0a0a0a"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#fade)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- a page card, the thing Axiom makes -->
    <g transform="translate(948 58) rotate(6)">
      <rect width="232" height="300" rx="30" fill="#141414" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
      <rect x="22" y="24" width="188" height="54" rx="14" fill="rgba(255,255,255,.07)"/>
      <rect x="22" y="90" width="188" height="72" rx="16" fill="rgba(255,255,255,.07)"/>
      <rect x="34" y="102" width="48" height="48" rx="14" fill="#ffffff"/>
      <rect x="94" y="110" width="74" height="12" rx="6" fill="#ffffff"/>
      <rect x="94" y="130" width="98" height="8" rx="4" fill="#b2aeae" opacity=".7"/>
      <rect x="22" y="176" width="188" height="42" rx="21" fill="#ffffff"/>
      <rect x="42" y="192" width="70" height="10" rx="5" fill="#0a0a0a"/>
      <rect x="22" y="230" width="89" height="46" rx="16" fill="rgba(255,255,255,.07)"/>
      <rect x="121" y="230" width="89" height="46" rx="16" fill="rgba(255,255,255,.07)"/>
      <rect x="36" y="248" width="44" height="9" rx="4.5" fill="#b2aeae" opacity=".8"/>
      <rect x="135" y="248" width="52" height="9" rx="4.500" fill="#b2aeae" opacity=".8"/>
    </g>

    <circle cx="70" cy="68" r="5" fill="#8b93a3"/>
    <text x="88" y="74" class="mono" font-size="17" letter-spacing="2.4" fill="#b2aeae">GITHUB / NGINX1337</text>

    <text x="62" y="228" class="sans" font-size="156" font-weight="800" letter-spacing="-7" fill="#ffffff">nginx<tspan class="caret" fill="#8b93a3">_</tspan></text>

    <text x="68" y="304" class="sans" font-size="27" font-weight="500" fill="#ffffff" opacity=".86">Делаю Axiom — страницы «ссылка в био»</text>
    <text x="68" y="350" class="mono" font-size="17" letter-spacing="2.4" fill="#b2aeae">ВАЙБКОДЕР · FIGMA · NUXT</text>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="398.5" rx="27.25" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
</svg>
